[tools]
biome = "2.5.11"
lefthook = "2.1.6"
node = "26.3.1"
rust = "1.98.0"
usage = "6.8.0"

[tasks.ui]
description = "Install and build the embedded desktop UI"
run = "pnpm --dir crates/mediaar/ui install && pnpm --dir crates/mediaar/ui build"

[tasks.dev-desktop]
description = "Run Mediaar desktop from the single binary"
depends = ["ui"]
run = "cargo run -p mediaar -- desktop"

[tasks.dev-tui]
description = "Run Mediaar TUI from the single binary"
run = "cargo run -p mediaar -- tui"

[tasks.build]
description = "Build the distributable mediaar binary"
depends = ["ui"]
run = "cargo build -p mediaar --release"

[tasks.format]
description = "Format Rust (rustfmt) and UI (Biome)"
run = [
  "cargo fmt --all",
  "biome format --write",
]

[tasks.lint]
description = "Lint Rust (clippy) and UI (Biome)"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "biome lint",
]

[tasks.typecheck]
description = "Typecheck Rust (cargo check) and UI (TypeScript 7 native tsc)"
run = [
  "cargo check --workspace",
  "pnpm --dir crates/mediaar/ui exec tsc --noEmit -p tsconfig.json",
]

[tasks.pack-release]
description = "Build release tarball with binary, man, zsh completion, desktop entry, icons"
run = "scripts/pack-release.sh"

[tasks.install-script-dry-run]
description = "Dry-run the user install script"
run = "sh install.sh --dry-run"

[tasks.hooks]
description = "Install git hooks via lefthook"
run = "lefthook install"
