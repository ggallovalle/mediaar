pre-commit:
  parallel: false
  jobs:
    - name: format
      run: |
        cargo fmt --all
        pnpm exec biome format --write
      stage_fixed: true
    - name: lint
      run: |
        cargo clippy --workspace --all-targets -- -D warnings
        pnpm exec biome lint
    - name: typecheck
      run: |
        cargo check --workspace
