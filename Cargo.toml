[workspace]
resolver = "2"
members = ["crates/kbgpui", "crates/mediaar"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
catppuccin = { version = "2.8", features = ["ratatui"] }
crossterm = "0.29"
dirs = "6"
fluent = "0.17"
gpui = "0.2.2"
kbgpui = { path = "crates/kbgpui" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unic-langid = "0.9"
usage = { package = "usage-rs", version = "6", features = ["completions", "config"] }
usage-config = { version = "6", features = ["toml"] }
toml = "0.9"
toml_edit = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
