[workspace]
resolver = "2"
members = ["crates/mediaar"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
catppuccin = { version = "2.8", features = ["ratatui"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
